# /etc/nginx/sites-available/c3r  →  sites-enabled 에 심볼릭 링크
# certbot 으로 인증서를 받으면 443 블록은 certbot 이 알아서 채워 넣는다:
#   sudo certbot --nginx -d cccr.or.kr -d www.cccr.or.kr

server {
    listen 80;
    server_name cccr.or.kr www.cccr.or.kr;

    # 첨부파일 업로드 한도. 앱의 20MB 제한보다 넉넉하게 둔다.
    client_max_body_size 25M;

    # 업로드가 느린 회선에서 끊기지 않도록
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 가 해시를 붙여 내보내는 정적 자원은 오래 캐시해도 안전하다
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
