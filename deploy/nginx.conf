# /etc/nginx/sites-available/c3r  →  sites-enabled 에 심볼릭 링크
# certbot 으로 인증서를 받으면 443 블록은 certbot 이 알아서 채워 넣는다:
#   sudo certbot --nginx -d cccr.or.kr -d www.cccr.or.kr

server {
    listen 80;
    server_name cccr.or.kr www.cccr.or.kr;

    # 요청 본문 한도. 로그인·신청처럼 첨부가 없는 화면은 1MB 면 넉넉하다.
    # 아래 업로드 화면만 25MB 로 열어, 큰 요청을 아무 화면에나 쏟아붓지 못하게 한다.
    client_max_body_size 1M;

    # 업로드가 느린 회선에서 끊기지 않도록
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 첨부·그림을 올리는 화면: 관리자 화면 전체, 게시판 글쓰기·수정.
    # 서버 액션은 지금 보고 있는 화면 주소로 보내지므로 화면 주소로 가른다.
    # next.config.ts 의 serverActions.bodySizeLimit(25mb)와 같은 값이어야 한다. 한쪽만 바꾸면 그쪽에서 막힌다.
    location ~ ^/(admin(/|$)|(board|info)/[^/]+/(write|[0-9]+/edit)/?$) {
        client_max_body_size 25M;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 접속자가 보낸 X-Forwarded-For 에 덧붙이지 않고 진짜 주소로 덮어쓴다.
        # 덧붙이면 첫 값을 접속자가 마음대로 정할 수 있어 로그인·신청 횟수 제한을 피해 간다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 가 해시를 붙여 내보내는 정적 자원은 오래 캐시해도 안전하다
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
