# /etc/nginx/sites-available/c3r  →  sites-enabled 에 심볼릭 링크
# 요청량 제한은 deploy/nginx-limits.conf 를 /etc/nginx/conf.d/ 에 함께 넣어야 동작한다
# certbot 으로 인증서를 받으면 443 블록은 certbot 이 알아서 채워 넣는다:
#   sudo certbot --nginx -d cccr.kr -d www.cccr.kr

server {
    listen 80;
    # 새 홈페이지는 cccr.kr 이다. 옛 홈페이지는 cccr.or.kr 에 그대로 있고
    # 이 서버로 오지 않는다(2026-09-23 도메인 구매).
    server_name cccr.kr www.cccr.kr;

    # 앱이 멈췄거나 DB 가 죽었을 때 보여 줄 안내 화면.
    # 그대로 두면 이용자에게 빈 화면이 나간다(오류 안내는 자바스크립트로 그려지기 때문).
    proxy_intercept_errors on;
    error_page 500 502 503 504 /_maintenance.html;

    # 요청이 잦아 막았을 때(429)와 연결 수를 넘겼을 때(503) 보여 줄 안내.
    # 그냥 두면 Nginx 의 맨 영문 화면이 나가고 서버 종류·판 번호까지 함께 나간다.
    # 사무실처럼 여러 분이 한 회선을 쓰면 실제로 마주칠 수 있는 화면이다.
    error_page 429 /_toomany.html;

    location = /_toomany.html {
        alias /srv/c3r/app/deploy/toomany.html;
        internal;
    }

    # 주소는 /_maintenance.html 로 두어 앱의 진짜 주소와 겹치지 않게 하고,
    # 실제 파일 이름(maintenance.html)은 alias 로 가리킨다.
    # root 로 적으면 deploy/_maintenance.html 을 찾는데 그런 파일은 없다.
    location = /_maintenance.html {
        alias /srv/c3r/app/deploy/maintenance.html;
        internal;
    }

    # 요청 본문 한도. 로그인·신청처럼 첨부가 없는 화면은 1MB 면 넉넉하다.
    # 아래 업로드 화면만 25MB 로 열어, 큰 요청을 아무 화면에나 쏟아붓지 못하게 한다.
    client_max_body_size 1M;

    # 업로드가 느린 회선에서 끊기지 않도록
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 첨부·그림을 올리는 화면: 관리자 화면 전체, 게시판 글쓰기·수정.
    # 서버 액션은 지금 보고 있는 화면 주소로 보내지므로 화면 주소로 가른다.
    # next.config.ts 의 serverActions.bodySizeLimit(25mb)와 같은 값이어야 한다. 한쪽만 바꾸면 그쪽에서 막힌다.
    location ~ ^/(admin(/|$)|(board|info)/[^/]+/(write|[0-9]+/edit)/?$) {
        client_max_body_size 25M;
        limit_req zone=c3r_all burst=100 nodelay;
        limit_conn c3r_conn 50;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 로그인·가입·비밀번호 재설정·소셜 로그인 — 비밀번호를 맞혀 보는 시도를 앱에 닿기 전에 걸러 낸다
    location ~ ^/(login|signup|reset|api/auth)(/|$) {
        limit_req zone=c3r_auth burst=20 nodelay;
        limit_conn c3r_conn 50;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 화면 하나에 여러 요청이 오가므로 넉넉히 잡는다. nodelay 는 몰린 것을 미루지 않고 바로 보낸다
        limit_req zone=c3r_all burst=100 nodelay;
        limit_conn c3r_conn 50;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 접속자가 보낸 X-Forwarded-For 에 덧붙이지 않고 진짜 주소로 덮어쓴다.
        # 덧붙이면 첫 값을 접속자가 마음대로 정할 수 있어 로그인·신청 횟수 제한을 피해 간다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 가 해시를 붙여 내보내는 정적 자원(js·css)은 nginx 가 디스크에서 바로 보낸다.
    # 파일 이름에 내용 해시가 붙으므로 내용이 바뀌면 이름도 바뀐다. 그래서 1년 캐시가 안전하다.
    # (전에는 여기서 proxy_cache_valid 를 적었지만 proxy_cache 구역이 없어 아무 효과가 없었고,
    #  정적 파일 요청이 전부 Node 를 거쳤다.)
    location /_next/static/ {
        alias /srv/c3r/app/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 배포 중에는 잠깐 파일이 없을 수 있다. 그때는 앱에게 물어본다
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
