# /etc/nginx/conf.d/c3r-limits.conf
# 설치:  sudo cp deploy/nginx-limits.conf /etc/nginx/conf.d/c3r-limits.conf
#
# 요청량 제한은 http 블록에 있어야 해서 server 설정(nginx.conf)과 파일을 나눈다.
# conf.d/ 아래 파일은 nginx 가 http 블록 안으로 읽어 들인다.
#
# 값은 넉넉하게 잡았다. 화면 하나를 열면 그림·글꼴·스크립트까지 여러 번 오가므로,
# 빡빡하게 잡으면 평범한 이용자가 먼저 막힌다. 여기서 막으려는 것은
# 한 곳에서 쉬지 않고 두드리는 경우(긁어 가는 봇, 비밀번호 맞히기)다.

# 한 회사·기관에서 여러 명이 같은 인터넷 회선(같은 주소)으로 들어오는 것을 감안해 넉넉히 잡는다.
# 화면 하나를 여는 데 요청이 열댓 건 오가므로, 열 명이 함께 보면 초당 수십 건이 된다.
# 주소별 일반 요청: 초당 50건, 갑자기 몰리면 100건까지 받아 둔다
limit_req_zone $binary_remote_addr zone=c3r_all:10m rate=50r/s;

# 로그인·가입·비밀번호 재설정: 초당 5건, 20건까지 받아 둔다
# (화면을 미리 받아 두는 동작까지 있어 1건으로 잡으면 평범한 이용자가 막힌다)
# (앱 안에도 횟수 제한이 있다. 이것은 앱에 닿기 전에 걸러 내는 그물이다)
limit_req_zone $binary_remote_addr zone=c3r_auth:10m rate=5r/s;

# 한 주소가 동시에 붙잡을 수 있는 연결 수. 첨부파일을 한꺼번에 긁어 가는 것을 막는다
# (브라우저 하나가 6개쯤 쓰므로 50 이면 같은 회선에서 여덟 명쯤까지 넉넉하다)
limit_conn_zone $binary_remote_addr zone=c3r_conn:10m;

# 막았을 때 돌려줄 코드. 기본은 503 인데, 429(요청이 너무 많음)가 뜻이 분명하다
limit_req_status 429;
limit_conn_status 429;
